version: "3"

networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  node:
    build: .
    command: npm run fake
    networks:
      - app
      - frontend
    ports:
      - '3010'
      - '3050'
      - '4443'
    volumes:
      - .:/app:delegated
    working_dir: /app
    privileged: true
    extra_hosts:
      - 'bibbox-statistik.teknik.local:10.176.0.26'

  redis:
    image: redis:4
    networks:
      - app
    ports:
      - '6379'
